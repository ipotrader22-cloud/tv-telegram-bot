name: Update PR81 current-state manifest

on:
  push:
    branches:
      - docs/record-pr81-production-state

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/record-pr81-production-state
          fetch-depth: 0
      - name: Update current-state manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('PROJECT-SOURCE-OF-TRUTH/VIXALE-WEBSITE-CURRENT-STATE.md')
          text = path.read_text()

          start = 'Latest direct verification for the website/dashboard scope:\n\n'
          end = 'A later documentation-only manifest commit may advance `main` and trigger Render Auto-Deploy without changing website behavior. Such a docs-only deploy does not replace the latest website-changing code reference above.\n'
          if start not in text or end not in text:
              raise SystemExit('Current-state verification markers not found')

          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          verification = '''Latest direct verification for the website/dashboard scope:\n\n- **Latest website-changing merge on `main`:** PR #81 — `Add public Options intro and clarify Services paths`\n- **PR #81 final head SHA:** `dbf039a4285aeb40a7f8d99f2508f1c285259419`\n- **PR #81 merge SHA / latest website-changing repository code reference:** `69f748ec5150d8c61b87941d9a8c1812d0c5b8c9`\n- **Observed PR state:** MERGED\n- **Render service:** `tv-telegram-bot`\n- **Render branch:** `main`\n- **Render Auto-Deploy:** enabled / commit-triggered\n- **Render deployment for PR #81 merge SHA:** `dep-dagaa2btqb8s73bejb70`\n- **PR #81 Render deployed SHA:** `69f748ec5150d8c61b87941d9a8c1812d0c5b8c9`\n- **PR #81 deployment status:** LIVE, independently verified from Render after successful build/startup.\n- **Public website user-visible verification:** **CONFLICT / UNVERIFIED** from independent crawl at this update. The available `vixale.com` crawler still returned stale pre-PR81 content for `/services` and `/closed-trades` and could not fetch `/trading-systems/options`. That stale crawl must not be used to contradict the exact GitHub/Render deployment evidence.\n\nA later documentation-only manifest commit may advance `main` and trigger Render Auto-Deploy without changing website behavior. Such a docs-only deploy does not replace the latest website-changing code reference above.\n'''
          text = before + verification + after

          anchor = '## PR #73 — Homepage Live Open P&L merged and deployed\n'
          if anchor not in text:
              raise SystemExit('PR73 anchor not found')

          section = '''## PR #81 — Options public intro + commercial IA merged and deployed\n\nPR #81 (`Add public Options intro and clarify Services paths`) is merged to `main` at `69f748ec5150d8c61b87941d9a8c1812d0c5b8c9` and was independently verified LIVE on Render as deployment `dep-dagaa2btqb8s73bejb70`.\n\nProduction repository/deployment contract:\n\n- `/trading-systems/options` is the public Options explainer before login.\n- `/trading-systems/options/viewer` is the protected Options viewer and internally reuses the existing `/dashboard` owner/viewer authorization and session path. No second auth system is introduced.\n- The protected viewer continues to use the existing Option Journal viewer table, closed-only Options equity calculation, and existing protected brokerage-proof URLs.\n- `/admin/options` manual owner create/edit/delete and proof workflows remain unchanged.\n- Existing Options data contract remains `Option Journal!A:S`; existing Credit/Debit P&L formulas and closed-only eligibility remain unchanged.\n- `/services` adds a no-price commercial overview for Viewer Access, Signals & Research Access, Automation Setup, and Custom Development while preserving the existing service forms. Custom development remains quote-based; no standardized price or paid plan is introduced.\n- Services copy explicitly states that Vixale does not trade or manage customer brokerage accounts.\n- Closed Trades archive event names are normalized only for customer-facing display (`Take Profit`, `Stop Loss`, `End-of-Day Close`, `Manual Close`); raw worksheet/event values are not rewritten.\n- No Pine, strategy rules, signals, entries/exits/stops/targets, risk, Telegram lifecycle, bridge, TWS/IBKR execution, broker-order behavior, Sheets writer/schema, Swing automation, or Options owner-entry behavior is changed by PR #81.\n\nValidation before merge:\n\n- GitHub Actions run `34293569480`: SUCCESS on the code-change commit.\n- `node --check app.js`: PASS.\n- Syntax checks for all four changed website modules and focused tests: PASS.\n- Options public/viewer routing and dashboard-auth reuse regression: PASS.\n- Trading Systems public Options regression: PASS.\n- Services/public-IA regression: PASS.\n- Closed Trades archive regression: PASS.\n- shared navigation/public-polish/PR3 homepage regressions: PASS.\n\nUser-visible crawl verification is not yet independent because the available web crawl was stale/unavailable after deployment. Treat repository/deployment state as verified and public browser presentation as **CONFLICT / UNVERIFIED** until a fresh browser or owner visual check confirms it.\n\n'''
          text = text.replace(anchor, section + anchor, 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/update-pr81-current-state.yml
      - name: Commit manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-SOURCE-OF-TRUTH/VIXALE-WEBSITE-CURRENT-STATE.md .github/workflows/update-pr81-current-state.yml
          git commit -m "Record PR81 production deployment"
          git push origin HEAD:docs/record-pr81-production-state
