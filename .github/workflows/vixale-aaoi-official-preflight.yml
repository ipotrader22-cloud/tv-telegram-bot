name: VIXALE AAOI Official News Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/vixale-aaoi-official-preflight.js'
      - 'scripts/vixale-aaoi-official-release.js'
      - '.github/workflows/vixale-aaoi-official-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/vixale-aaoi-official-preflight.js
