name: Verify live chart rendering

on:
  push:
    branches: [diagnose/live-chart-runtime]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live endpoint data and inline script syntax
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L https://www.vixale.com/public-performance.json -o /tmp/perf.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/perf.json'))
          assert data.get('ok') is True, data
          points=(data.get('equity_curve') or {}).get('points') or []
          assert len(points) > 2, f'expected realized equity points, got {len(points)}'
          print('performance endpoint PASS; points=', len(points))
          PY

          mkdir -p /tmp/live-scripts
          for page in home results; do
            url="https://www.vixale.com/"
            [[ "$page" == "results" ]] && url="https://www.vixale.com/results"
            curl -sS -L "$url" -o "/tmp/$page.html"
            PAGE="$page" python - <<'PY'
          import os,re,pathlib
          page=os.environ['PAGE']
          text=pathlib.Path(f'/tmp/{page}.html').read_text(errors='replace')
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',text,re.I)
          print(page,'inline scripts',len(scripts))
          out=pathlib.Path('/tmp/live-scripts')
          for i,s in enumerate(scripts):
              (out/f'{page}-{i:02d}.js').write_text(s)
          PY
          done

          for f in /tmp/live-scripts/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Verify charts execute in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "Chrome=$CHROME"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom https://www.vixale.com/ > /tmp/home.dom 2> /tmp/home.chrome.log
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom https://www.vixale.com/results > /tmp/results.dom 2> /tmp/results.chrome.log

          python - <<'PY'
          from pathlib import Path
          home=Path('/tmp/home.dom').read_text(errors='replace')
          results=Path('/tmp/results.dom').read_text(errors='replace')

          assert 'id="vx-conversion-day-equity-svg"' in home, 'homepage preview SVG was not rendered'
          assert 'id="vx-home-equity-svg"' in home, 'homepage lower equity SVG was not rendered'
          assert 'Loading realized-results chart' not in home, 'homepage preview still shows loading state'

          marker='id="vx-results-day-chart"'
          idx=results.find(marker)
          assert idx >= 0, 'results chart container missing'
          segment=results[idx:idx+12000]
          assert '<polyline' in segment, 'results realized chart polyline was not rendered'
          assert 'Loading Day Trading realized history' not in segment, 'results chart still shows loading state'

          print('headless browser chart render PASS')
          PY

          echo 'Chrome console/error scan:'
          cat /tmp/home.chrome.log /tmp/results.chrome.log | grep -Ei 'uncaught|syntaxerror|referenceerror|typeerror|refused to execute|content security' && exit 1 || true
