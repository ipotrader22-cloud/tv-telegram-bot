name: Apply Prime durable close fix

on:
  push:
    branches:
      - fix/prime-durable-close-trade-id-fallback
    paths:
      - .github/workflows/apply-prime-close-fix.yml

permissions:
  contents: write

jobs:
  apply-prime-close-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/prime-durable-close-trade-id-fallback
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          git apply --check .github/vixale-prime-close-patch/fix.patch
          git apply .github/vixale-prime-close-patch/fix.patch
          git diff --check -- app.js

      - name: Run focused checks
        shell: bash
        run: |
          node --check app.js
          node tests/test_prime_close_trade_id_fallback.js

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          git commit -m "Fix durable Prime close matching for legacy open rows"
          git push origin HEAD:fix/prime-durable-close-trade-id-fallback
