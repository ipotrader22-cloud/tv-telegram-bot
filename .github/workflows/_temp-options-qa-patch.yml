name: Temporary Options QA patch

on:
  push:
    branches:
      - fix/options-redesign-production-qa-20260923

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/options-redesign-production-qa-20260923
          fetch-depth: 0
      - name: Patch production QA
        run: python scripts/_temp_patch_options_qa.py
      - name: Validate and commit
        shell: bash
        run: |
          node --check scripts/qa-production-locales.js
          git rm .github/workflows/_temp-options-qa-patch.yml scripts/_temp_patch_options_qa.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa-production-locales.js
          git diff --cached --check
          git commit -m "Update production QA for Options redesign"
          git push origin HEAD:fix/options-redesign-production-qa-20260923
