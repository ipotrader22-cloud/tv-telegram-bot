name: Access Guard Handbook Update

on:
  push:
    branches:
      - feature/dashboard-access-guard

permissions:
  contents: write

jobs:
  update-handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dashboard-access-guard
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update handbook
        run: node scripts/update_access_guard_handbook.js
      - name: Commit handbook update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VECO_DEVELOPER_HANDBOOK.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Document Dashboard Access Guard contract'
          git push origin HEAD:feature/dashboard-access-guard
