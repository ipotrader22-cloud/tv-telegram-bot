name: Day Page Chart Refinement Check

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check website_conversion_system_pages_refinement.js
          node --check tests/test_day_page_chart_refinement.js
          node --check tests/test_chart_inline_script_injection.js
      - name: Dedicated Day chart regressions
        run: |
          node tests/test_day_page_chart_refinement.js
          node tests/test_chart_inline_script_injection.js
      - name: Existing performance regressions
        run: |
          node tests/test_results_chart_refinement.js
          node tests/test_public_performance.js
          node tests/test_issue123_pr7_final_qa.js
      - name: Diff check
        run: git diff --check origin/main...HEAD
