name: Swing UI Presentation Check

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check website_swing_ui_refinement.js
          node --check tests/test_swing_ui_refinement.js
      - name: Swing presentation regression
        run: node tests/test_swing_ui_refinement.js
      - name: Existing Swing regressions
        run: |
          node tests/test_swing_leaders.js
          node tests/test_swing_instructional_refinement.js
      - name: Existing final QA guard
        run: node tests/test_issue123_pr7_final_qa.js
      - name: Diff check
        run: git diff --check origin/main...HEAD
