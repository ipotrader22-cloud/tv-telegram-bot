name: SMI PR38 Pending Race Fix

on:
  push:
    branches:
      - feature/smi-v04-fwd-tws-adapter

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install existing bridge runtime dependencies
        run: python -m pip install requests python-dotenv fastapi ib_async

      - name: Apply pending-entry race fix
        run: python .github/smi-pr38-pending-race-fix.py

      - name: Verify syntax and regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          node --check app.js
          python -m py_compile bridge/ib_bridge.py bridge/ib_bridge_core.py bridge/smi_forward_adapter.py
          python tests/test_smi_forward_pine_contract.py
          python tests/test_smi_forward_bridge_isolation.py
          python tests/test_smi_forward_concurrency.py
          node tests/test_smi_forward_render_integration.js
          node tests/test_prime_close_trade_id_fallback.js
          node tests/test_vixale_edge_pending_lifecycle.js
          node tests/test_vixale_edge_pending_eod_cleanup.js
          python tests/test_shrek_eod_watchdog.py
          python tests/test_vixale_edge_bridge_isolation.py
          git diff --check
          cmp -s bridge/ib_bridge_core.py <(git show origin/main:bridge/ib_bridge.py)

      - name: Commit verified fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/smi-pr38-pending-race-fix.yml .github/smi-pr38-pending-race-fix.py
          git add bridge/smi_forward_adapter.py tests/test_smi_forward_concurrency.py docs/VECO_DEVELOPER_HANDBOOK.md
          git diff --cached --check
          git commit -m "Close SMI pending-entry duplicate race [smi-pr38-pending-fixed]"
          git push origin HEAD:feature/smi-v04-fwd-tws-adapter
