name: Temporary Dashboard snapshot verification

on:
  push:
    branches: [fix/dashboard-snapshot-follow-up]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node --check app.js
      - run: node --check website_dashboard_snapshot_refinement.js
      - run: node --check tests/test_dashboard_snapshot_refinement.js
      - run: node --check tests/test_public_dashboard_live_pnl.js
      - run: node --check tests/test_home_live_open_pnl.js
      - run: node --check tests/test_public_performance.js
      - run: node --check tests/test_dashboard_access_security.js
      - run: node --check tests/test_home_performance_refinement.js
      - run: node tests/test_dashboard_snapshot_refinement.js
      - run: node tests/test_public_dashboard_live_pnl.js
      - run: node tests/test_home_live_open_pnl.js
      - run: node tests/test_public_performance.js
      - run: node tests/test_dashboard_access_security.js
      - run: node tests/test_home_performance_refinement.js
