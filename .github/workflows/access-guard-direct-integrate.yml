name: Access Guard Direct Integration

on:
  push:
    branches:
      - feature/dashboard-access-guard

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dashboard-access-guard
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded direct app patch and handbook update
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { patchAppSource, APP_PATCH_MARKER } = require('./website_dashboard_access_security');

          const appPath = 'app.js';
          const originalApp = fs.readFileSync(appPath, 'utf8');
          const patchedApp = patchAppSource(originalApp);
          if (!patchedApp.includes(APP_PATCH_MARKER)) throw new Error('Access Guard marker missing after direct patch');
          fs.writeFileSync(appPath, patchedApp);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts.start = String(pkg.scripts.start || '').replace('node -r ./website_dashboard_access_security.js ', 'node ');
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const handbookPath = 'docs/VECO_DEVELOPER_HANDBOOK.md';
          let handbook = fs.readFileSync(handbookPath, 'utf8');
          handbook = handbook.replace('**Last updated:** 2026-09-04', '**Last updated:** 2026-09-07');
          handbook = handbook.replace(
            'PASSWORD_REQUEST_BCC\nOPTION_PROOFS_DIR',
            'PASSWORD_REQUEST_BCC\nTURNSTILE_SITE_KEY\nTURNSTILE_SECRET_KEY\nOPTION_PROOFS_DIR'
          );

          const accessSectionMarker = '### 10.1.1 Dashboard access request security';
          if (!handbook.includes(accessSectionMarker)) {
            const insertionPoint = '### 10.2 Operational admin surfaces';
            if (!handbook.includes(insertionPoint)) throw new Error('Handbook dashboard insertion point missing');
            const accessSection = `### 10.1.1 Dashboard access request security

The public Dashboard Access request flow is separate from dashboard login and from
owner/admin authentication. Its only public submission route remains:

\`\`\`text
POST /password-request
\`\`\`

Admission order is fixed:

\`\`\`text
honeypot body.website
-> per-IP rate limit (5 attempts / 15 minutes)
-> normalize and validate email
-> per-normalized-email rate limit (3 attempts / 60 minutes)
-> Cloudflare Turnstile server verification, action dashboard_access
-> write Awaiting Verification request
-> send Resend confirmation email
-> applicant confirms one-time email token
-> request becomes Pending
-> existing owner notification
-> existing manual Create 30-Day Code approval only
\`\`\`

Turnstile protects only the public access form. The browser receives only
\`TURNSTILE_SITE_KEY\`; \`TURNSTILE_SECRET_KEY\` remains server-side and is sent
only to Cloudflare Siteverify. Missing production Turnstile configuration fails
closed for new public access requests. The existing \`body.website\` honeypot is
retained. Rate limiting is bounded in-process state and is not global Express
middleware.

The existing \`Dashboard Access Requests\` worksheet preserves A:I and appends:

\`\`\`text
J Verification Token Hash
K Verification Expires At
L Verified At
\`\`\`

A new request is stored as \`Awaiting Verification\` for 60 minutes. Only a
SHA-256 hash is persisted; the raw cryptographically random verification token is
sent only in the email URL and is never stored or logged. Successful one-time
verification clears the stored hash, writes \`Verified At\`, and changes status
to \`Pending\`. Invalid, expired, or reused links cannot enter Pending and cannot
repeat owner notification. A confirmation-email delivery failure remains outside
Pending as \`Verification Email Failed\`.

Email verification never creates a viewer code. Existing dashboard owner/viewer
authentication and \`POST /dashboard-login\` remain unchanged. Only the existing
authenticated owner approval route may create the 30-day viewer code.

Pending Requests displays only rows whose status is exactly Pending. Approve and
Reject retain their existing semantics. Owner-only permanent Delete uses the same
\`adminAccessRequestAllowed()\` authorization and Google Sheets
\`deleteDimension\` pattern; it is refused when the request already has a Code ID
or when an access-code row references that request. Deleting a request never
revokes or modifies a viewer code.

Production activation requires a real Cloudflare Turnstile widget authorized for
Vixale hostnames plus \`TURNSTILE_SITE_KEY\` and \`TURNSTILE_SECRET_KEY\` in the
Render service environment. Repository merge alone is not proof that Access Guard
is active; Render deployment and live form/verification/manual-approval behavior
must be independently verified.

`;
            handbook = handbook.replace(insertionPoint, accessSection + insertionPoint);
          }

          const adrMarker = '### ADR-017 — Dashboard access requires bot defense, email verification, and manual approval';
          if (!handbook.includes(adrMarker)) {
            const adrInsertionPoint = '## 18. Open Documentation Items';
            if (!handbook.includes(adrInsertionPoint)) throw new Error('Handbook ADR insertion point missing');
            const adr = `### ADR-017 — Dashboard access requires bot defense, email verification, and manual approval

**Decision:** A public dashboard access submission does not enter the owner Pending
queue until it passes the existing honeypot, bounded IP/email rate limits,
server-validated Cloudflare Turnstile, and one-time email verification. Email
verification changes only request review state; it cannot create a viewer code.
The existing authenticated owner Approve action remains the sole viewer-code
creation path. Rejected requests remain for audit; unlinked spam requests may be
physically deleted only by the same owner authorization guard, and code-linked
requests cannot be deleted from the request table.

**Reason:** Public form submission and email delivery are insufficient evidence of
a legitimate applicant. Separating anti-bot admission, email ownership proof, and
manual access approval prevents automated submissions from filling Pending while
preserving the established dashboard viewer-code trust boundary.

**Schema impact:** \`Dashboard Access Requests\` extends from A:I to A:L by
appending verification token hash, expiration, and verified timestamp. Existing
historical A:I rows remain parseable. No dashboard access-code schema, trading
worksheet, webhook payload, bridge, Pine, order, risk, or broker lifecycle contract
changes.

**Deployment impact:** Production requires a Cloudflare Turnstile widget and the
Render environment variables \`TURNSTILE_SITE_KEY\` and
\`TURNSTILE_SECRET_KEY\`. The secret is never browser-exposed. If configuration is
incomplete, new public requests fail closed. Activation must be verified from the
live Render deployment and public form before being recorded as active.

---

`;
            handbook = handbook.replace(adrInsertionPoint, adr + adrInsertionPoint);
          }
          fs.writeFileSync(handbookPath, handbook);

          for (const disposable of ['website_dashboard_access_security.js', 'lib/dashboard-access-security-source-blocks.js']) {
            if (fs.existsSync(disposable)) fs.unlinkSync(disposable);
          }
          NODE
      - name: Verify direct integration
        run: |
          node --check app.js
          node --check lib/dashboard-access-security.js
          node --check tests/test_dashboard_access_security.js
          node tests/test_dashboard_access_security.js
          node -e "const p=require('./package.json'); if (p.scripts.start.includes('website_dashboard_access_security')) process.exit(1)"
          test ! -e website_dashboard_access_security.js
          test ! -e lib/dashboard-access-security-source-blocks.js
          git diff --check
      - name: Commit direct integration
        run: |
          if git diff --quiet; then
            echo 'No direct integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js package.json docs/VECO_DEVELOPER_HANDBOOK.md tests/test_dashboard_access_security.js lib/dashboard-access-security.js
          git add -u website_dashboard_access_security.js lib/dashboard-access-security-source-blocks.js
          git commit -m 'Integrate Access Guard directly into app'
          git push origin HEAD:feature/dashboard-access-guard
