name: Temporary dashboard snapshot diagnostic

on:
  push:
    branches: [fix/dashboard-snapshot-follow-up]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node tests/diagnose_dashboard_snapshot_follow_up.js
