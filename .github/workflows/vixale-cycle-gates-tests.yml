name: VIXALE Production Cycle Gates Unit Tests
on:
  pull_request:
    paths:
      - 'scripts/vixale-production-cycle-gates.js'
      - 'test/vixale-production-cycle-gates.test.js'
      - '.github/workflows/vixale-cycle-gates-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/vixale-production-cycle-gates.test.js
