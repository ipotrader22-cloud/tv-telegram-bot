name: Verify audit PR3 website UX
on:
  push:
    branches:
      - polish/audit-home-nav-accessibility-pr3
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check app.js
      - run: node --check website_home_conversion_refinement.js
      - run: node --check website_home_system_selector_refinement.js
      - run: node --check website_navigation_disclosure_refinement.js
      - run: node --check website_trading_systems_product_refinement.js
      - run: node --check tests/test_home_conversion_refinement.js
      - run: node --check tests/test_home_system_selector_refinement.js
      - run: node --check tests/test_navigation_disclosure_refinement.js
      - run: node --check tests/test_trading_systems_product_refinement.js
      - run: node --check tests/test_audit_pr3_home_composition.js
      - run: node tests/test_home_conversion_refinement.js
      - run: node tests/test_home_system_selector_refinement.js
      - run: node tests/test_navigation_disclosure_refinement.js
      - run: node tests/test_trading_systems_product_refinement.js
      - run: node tests/test_audit_pr3_home_composition.js
      - run: node tests/test_home_performance_refinement.js
      - run: node tests/test_performance_truth_refinement.js
      - run: node tests/test_public_ia_refinement.js
      - run: node tests/test_public_polish_refinement.js
      - run: node tests/test_about_refinement.js
      - run: node tests/test_trading_guide_style_refinement.js
      - run: node tests/test_swing_canonical_route_refinement.js
      - run: node tests/test_options_canonical_refinement.js
      - run: node tests/test_home_live_open_pnl.js
      - name: Verify PR3 safety boundaries
        run: |
          if grep -n "fetch(" website_home_system_selector_refinement.js; then echo "Hero preview must mirror approved DOM data without a new fetch"; exit 1; fi
          grep -q 'href="/#password-access">Request Free Access' website_home_conversion_refinement.js
          grep -q 'Performance</a>' website_navigation_disclosure_refinement.js
          grep -q 'Pending setups may be visible before fill' website_trading_systems_product_refinement.js
