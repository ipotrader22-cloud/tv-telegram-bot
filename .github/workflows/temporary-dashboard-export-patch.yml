name: Temporary Dashboard export patch

on:
  push:
    branches: [fix/dashboard-snapshot-follow-up]
    paths:
      - .github/workflows/temporary-dashboard-export-patch.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact renderDashboardHtml export context
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app.js').read_text()
          needle = 'renderDashboardHtml'
          positions = []
          start = 0
          while True:
              index = source.find(needle, start)
              if index < 0:
                  break
              positions.append(index)
              start = index + len(needle)
          print('occurrences:', len(positions))
          for index in positions:
              print('\n--- context ---')
              print(source[max(0,index-500):min(len(source),index+700)])
          PY
