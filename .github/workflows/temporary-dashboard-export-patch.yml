name: Temporary Dashboard export patch

on:
  push:
    branches: [fix/dashboard-snapshot-follow-up]
    paths:
      - .github/workflows/temporary-dashboard-export-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export existing Dashboard data builder for refinement reuse
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          source = path.read_text()
          replacement = '    getDashboardData,\n    renderDashboardHtml,\n'
          if replacement not in source:
              needle = '    renderDashboardHtml,\n'
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'Expected exactly one renderDashboardHtml export, found {count}')
              source = source.replace(needle, replacement, 1)
              path.write_text(source)
          PY
          git diff --check
          git diff -- app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "app.js export already present"
          else
            git commit -m "Expose Dashboard data builder to snapshot refinement"
            git push origin HEAD:fix/dashboard-snapshot-follow-up
          fi
