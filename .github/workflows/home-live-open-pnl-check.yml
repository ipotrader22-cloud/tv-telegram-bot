name: Homepage live open P&L check

on:
  push:
    branches:
      - feature/home-live-open-pnl

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - name: Syntax and package configuration
        run: |
          node --check website_home_live_open_pnl.js
          node --check tests/test_home_live_open_pnl.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "const s=require('./package.json').scripts.start; if(!s.includes('-r ./website_home_live_open_pnl.js -r ./website_home_performance_refinement.js')) process.exit(1)"
      - name: Homepage live open P&L tests
        run: node tests/test_home_live_open_pnl.js
      - name: Homepage performance regression
        run: node tests/test_home_performance_refinement.js
      - name: Public dashboard live P&L regression
        run: node tests/test_public_dashboard_live_pnl.js
      - name: Public performance regression
        run: node tests/test_public_performance.js
