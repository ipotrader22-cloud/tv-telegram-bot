name: Verify PR147 Production

on:
  pull_request:
    branches: [main]

jobs:
  verify-live-swing:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch fresh Swing page
        run: |
          set -euo pipefail
          URL="https://www.vixale.com/trading-systems/swing-trading?verify_pr147=${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "$URL" > /tmp/swing.html
          test -s /tmp/swing.html
      - name: Verify Market Update presentation
        run: |
          set -euo pipefail
          grep -F 'data-vx-swing-market-update="1"' /tmp/swing.html
          grep -F '<h2>Market Update</h2>' /tmp/swing.html
          grep -F '.vx-swing-posture-copy{margin:0;color:#5f6d67;font-size:18px;line-height:1.5' /tmp/swing.html
          grep -E '<strong>Released:</strong> [0-9]{4}-[0-9]{2}-[0-9]{2} · [0-9]{1,2}(:[0-9]{2})? ET' /tmp/swing.html
      - name: Verify existing Swing hierarchy remains
        run: |
          set -euo pipefail
          grep -F 'data-vx-swing-how="beginner"' /tmp/swing.html
          grep -F '<small>Candidates</small>' /tmp/swing.html
          grep -F '$10K / position' /tmp/swing.html
          if grep -F '<h2>Market Posture</h2>' /tmp/swing.html; then
            echo 'Old Market Posture heading still rendered' >&2
            exit 1
          fi
