name: PR74 PR1 Verification

on:
  push:
    branches:
      - fix/access-truth-services-copy
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check website_public_ia_refinement.js
          node --check website_watch_system_refinement.js
          node --check lib/dashboard-access-security.js
          node --check tests/test_public_ia_refinement.js
          node --check tests/test_watch_system_refinement.js
          node --check tests/test_dashboard_access_security.js
      - name: Focused regressions
        run: |
          node tests/test_public_ia_refinement.js
          node tests/test_watch_system_refinement.js
          node tests/test_dashboard_access_security.js
          node tests/test_home_conversion_refinement.js
