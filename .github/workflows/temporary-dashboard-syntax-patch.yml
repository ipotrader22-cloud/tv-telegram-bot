name: Temporary Dashboard syntax patch

on:
  push:
    branches: [fix/dashboard-snapshot-follow-up]
    paths:
      - .github/workflows/temporary-dashboard-syntax-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct over-escaped regex literals
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('website_dashboard_snapshot_refinement.js')
          lines = path.read_text().splitlines()
          targets = [
              ('normalized whitespace', lambda line: '.replace(/' in line and 's+/g, " ")' in line),
              ('opening tag regex', lambda line: 'return block.replace(/^<([a-z0-9]+)' in line),
              ('class attribute regex', lambda line: 'const classMatch = attrs.match(/' in line),
              ('dashboard h1 regex', lambda line: '.replace(/<h1>' in line and 'Vixale Live Strategy Dashboard' in line),
              ('dashboard subtitle regex', lambda line: '.replace(/(<div' in line and 'Private live forward-test' in line),
          ]

          changed = []
          for label, predicate in targets:
              indexes = [i for i, line in enumerate(lines) if predicate(line)]
              if len(indexes) != 1:
                  raise SystemExit(f'{label}: expected exactly one line, found {len(indexes)}')
              index = indexes[0]
              before = lines[index]
              after = before.replace('\\\\', '\\')
              if after == before:
                  raise SystemExit(f'{label}: expected an over-escaped regex literal')
              lines[index] = after
              changed.append(label)

          if len(changed) != 5:
              raise SystemExit(f'expected 5 corrections, got {len(changed)}')
          path.write_text('\n'.join(lines) + '\n')
          print('Corrected:', ', '.join(changed))
          PY
          node --check website_dashboard_snapshot_refinement.js
          git diff --check
          git diff -- website_dashboard_snapshot_refinement.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website_dashboard_snapshot_refinement.js
          git commit -m "Fix snapshot refinement regex literals"
          git push origin HEAD:fix/dashboard-snapshot-follow-up
