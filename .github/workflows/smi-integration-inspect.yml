name: SMI Render integration patch

on:
  push:
    branches:
      - feature/smi-v04-fwd-tws-adapter

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[smi-render-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Recover and apply assert-driven SMI routing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source_commit = '5bf9d55e7d2bf897525ceaf7440857d4f14f607f'
          previous = subprocess.check_output(
              ['git', 'show', f'{source_commit}:.github/workflows/smi-integration-inspect.yml'],
              text=True,
          )
          start_marker = "      - name: Apply assert-driven SMI routing patch\n"
          next_marker = "      - name: Syntax and focused SMI routing checks\n"
          start = previous.index(start_marker)
          run_start = previous.index("        run: |\n", start) + len("        run: |\n")
          end = previous.index(next_marker, run_start)
          block = previous[run_start:end]
          lines = block.splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"

          old_helper = "def replace_once(old, new, label):\n    global text\n    count = text.count(old)\n    assert count == 1, f'{label}: expected 1 anchor, found {count}'\n    text = text.replace(old, new, 1)\n"
          new_helper = "def replace_once(old, new, label):\n    global text\n    scoped_labels = {'SMI callback evidence gates', 'SMI durable publication errors'}\n    if label in scoped_labels:\n        scope_start = text.index('async function processRecognizedTradingViewWebhook(')\n        scope_end = text.index('async function processRecognizedTradingViewWebhookLifecycle(', scope_start)\n        scope = text[scope_start:scope_end]\n        count = scope.count(old)\n        assert count == 1, f'{label}: expected 1 scoped anchor, found {count}'\n        scope = scope.replace(old, new, 1)\n        text = text[:scope_start] + scope + text[scope_end:]\n        return\n    count = text.count(old)\n    assert count == 1, f'{label}: expected 1 anchor, found {count}'\n    text = text.replace(old, new, 1)\n"
          assert old_helper in script
          script = script.replace(old_helper, new_helper, 1)

          old_exports = "  isSmiForwardRow,\\n  validateSmiForwardTransportContract,\\n  isSmiEntryFillBrokerCallback,"
          new_exports = "  isSmiForwardRow,\\n  hasSmiForwardCallbackIdentity,\\n  isSmiBrokerExitShape,\\n  isBridgeExecutionCallback,\\n  validateSmiForwardTransportContract,\\n  isSmiEntryFillBrokerCallback,"
          assert old_exports in script
          script = script.replace(old_exports, new_exports, 1)

          assert "SMI_FWD_SYSTEM_ID" in script
          assert "path.write_text(text, encoding='utf-8')" in script
          Path('/tmp/smi_render_patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/smi_render_patch.py

      - name: Syntax and focused SMI routing checks
        shell: bash
        run: |
          node --check app.js
          python -m py_compile bridge/ib_bridge.py bridge/ib_bridge_core.py bridge/smi_forward_adapter.py
          node <<'NODE'
          const assert = require('assert');
          const Module = require('module');
          process.env.BRIDGE_URL = 'http://mock-bridge.test';
          process.env.BRIDGE_FORWARD_ENABLED = 'true';
          process.env.BRIDGE_DRY_RUN = 'true';
          process.env.MAX_BRIDGE_QTY = '1000';
          function fakeExpress() {
            return { set(){}, use(){}, get(){}, post(){}, listen(){ throw new Error('no listen'); } };
          }
          fakeExpress.json = fakeExpress.urlencoded = fakeExpress.text = () => (_req, _res, next) => next?.();
          const originalLoad = Module._load;
          Module._load = function(request, parent, isMain) {
            if (request === 'express') return fakeExpress;
            if (request === 'googleapis') {
              return { google: { auth: { GoogleAuth: class {} }, sheets: () => ({}) } };
            }
            return originalLoad.call(this, request, parent, isMain);
          };
          const t = require('./app.js').__test;
          Module._load = originalLoad;

          const base = {
            source: 'TradingView',
            system_id: 'VIXALE_SMI_FWD',
            strategy_id: 'SMI_HISTOGRAM_V0_4_FWD',
            strategy: 'SMI_HISTOGRAM_V0_4_FWD',
            research_version: '0.4-FWD',
            sec_type: 'STK',
            position_size_pct: 3,
            qty_source: 'TV Strategy Properties',
            signal: 'BUY',
            event: 'SETUP',
            symbol: 'AAPL',
            timeframe: '60',
            side: 'LONG',
            signal_bar_time: 1788379200000,
            setup_id: 'SMI_HISTOGRAM_V0_4_FWD:AAPL:60:LONG:1788379200000',
            entry: 100,
            target: 102,
            qty: 30,
            entry_order_type: 'MARKET',
            target_tif: 'GTC',
          };
          assert.deepStrictEqual(t.validateSmiForwardTransportContract(base), { ok: true, reason: 'ok' });
          assert.strictEqual(t.parseJsonTradingViewAlert(base).size, 30);
          const missingQty = { ...base };
          delete missingQty.qty;
          assert.strictEqual(t.parseJsonTradingViewAlert(missingQty).size, '');
          assert.strictEqual(t.validateSmiForwardTransportContract(missingQty).ok, false);
          assert.strictEqual(t.validateSmiForwardTransportContract({ ...base, position_size_pct: 4 }).ok, false);
          const payloadNoQty = t.bridgePayload(missingQty, t.parseJsonTradingViewAlert(missingQty));
          assert.strictEqual(Object.prototype.hasOwnProperty.call(payloadNoQty, 'qty'), false);

          const entryFill = {
            ...base,
            source: 'IB_BRIDGE',
            event: 'ENTRY_FILL',
            entry_filled: true,
            ib_status: 'submitted',
            ib_entry_status: 'Filled',
            ib_entry_fill_price: 100,
            ib_entry_filled_qty: 30,
            entry_execution_id: 'EXEC:SMI-ENTRY-1',
            ib_order_id: 101,
            ib_target_order_id: 102,
          };
          const entryRow = t.parseJsonTradingViewAlert(entryFill);
          assert.strictEqual(t.isSmiEntryFillBrokerCallback(entryFill, entryRow), true);
          assert.strictEqual(t.hasConfirmedSmiEntryExecution(entryFill, entryRow), true);
          assert.strictEqual(t.hasConfirmedSmiEntryExecution({ ...entryFill, ib_target_order_id: 0 }, entryRow), false);

          const close = {
            ...base,
            signal: 'EXIT_LONG',
            event: 'CLOSE_STOP',
            source: 'TradingView',
            render_forwarded_at: '2026-09-02 16:00:00',
            render_safety: { bridge_forward_enabled: true },
            close_filled: true,
            ib_status: 'Filled',
            ib_close_status: 'Filled',
            ib_order_id: 201,
            exit_execution_id: 'EXEC:SMI-CLOSE-1',
            position_after_close: 0,
          };
          const closeRow = t.parseJsonTradingViewAlert(close);
          assert.deepStrictEqual(t.validateSmiForwardTransportContract(close), { ok: true, reason: 'ok' }, 'SMI close transport contract');
          assert.strictEqual(t.isSmiForwardPayload(close), true, 'SMI close payload identity');
          assert.strictEqual(t.isSmiForwardRow(closeRow), true, 'SMI parsed close row identity');
          assert.strictEqual(t.isSmiBrokerExitShape(closeRow), true, `SMI parsed exit shape event=${closeRow.event} raw_event=${closeRow.raw_event} raw=${closeRow.raw}`);
          assert.strictEqual(t.isBridgeExecutionCallback(close), true, 'SMI close recognized as bridge execution callback');
          assert.strictEqual(t.hasSmiForwardCallbackIdentity(close), true, 'SMI close callback identity');
          assert.strictEqual(t.isSmiBrokerExitCallbackShape(close, closeRow), true, 'SMI close callback shape');
          assert.strictEqual(t.isPersistentSmiBrokerExitCallback(close, closeRow), true, 'SMI close execution evidence');
          assert.strictEqual(t.isPersistentSmiBrokerExitCallback({ ...close, position_after_close: 1 }, closeRow), false);
          console.log('Focused SMI Render routing checks passed');
          NODE

      - name: Prime and Edge regression smoke
        run: |
          node tests/test_prime_close_trade_id_fallback.js
          node tests/test_vixale_edge_pending_lifecycle.js
          node tests/test_vixale_edge_app_integration.js
          python tests/test_shrek_eod_watchdog.py
          python tests/test_vixale_edge_bridge_isolation.py

      - name: Commit Render patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "app.js"
          git commit -m "Route frozen SMI v0.4-FWD through execution-first UAM [smi-render-patched]"
          git push origin HEAD:feature/smi-v04-fwd-tws-adapter
