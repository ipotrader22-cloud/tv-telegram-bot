name: SMI integration inspect

on:
  push:
    branches:
      - feature/smi-v04-fwd-tws-adapter

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate single-character staging seam corruption
        shell: python
        run: |
          from pathlib import Path
          import base64, zlib, hashlib, re

          p0 = ''.join(Path('.github/smi-v04-fwd/part00.b64').read_text().split())
          p1 = ''.join(Path('.github/smi-v04-fwd/part01.b64').read_text().split())
          p2 = ''.join(Path('.github/smi-v04-fwd/part02.b64').read_text().split())
          print('lengths', len(p0), len(p1), len(p2))

          def partial_gzip(data):
              d = zlib.decompressobj(16 + zlib.MAX_WBITS)
              out = bytearray()
              error = ''
              for i in range(0, len(data), 256):
                  try:
                      out.extend(d.decompress(data[i:i+256]))
                  except zlib.error as exc:
                      error = str(exc)
                      break
              return bytes(out), error

          def octal(field):
              text = field.rstrip(b'\0 ').decode('ascii', errors='ignore').strip()
              if not re.fullmatch(r'[0-7]*', text):
                  return None
              try:
                  return int(text or '0', 8)
              except ValueError:
                  return None

          def tar_members(blob):
              members=[]; pos=0
              while pos + 512 <= len(blob):
                  header=blob[pos:pos+512]
                  if header == b'\0'*512: break
                  size=octal(header[124:136])
                  if size is None: break
                  name=header[:100].split(b'\0',1)[0].decode('utf-8', errors='replace')
                  prefix=header[345:500].split(b'\0',1)[0].decode('utf-8', errors='replace')
                  if prefix: name=prefix+'/'+name
                  data_start=pos+512; data_end=data_start+size
                  complete=data_end <= len(blob)
                  members.append((name,size,header[156:157],complete,data_start,data_end))
                  if not complete: break
                  pos=data_start+((size+511)//512)*512
              return members, pos

          candidates=[]
          for idx in range(len(p1)):
              joined = p0 + p1[:idx] + p1[idx+1:] + p2
              try:
                  compressed=base64.b64decode(joined, validate=True)
              except Exception:
                  continue
              out, err = partial_gzip(compressed)
              members, pos = tar_members(out)
              file_members=[m for m in members if m[2] in (b'0',b'\0')]
              pine_ok=False
              pine_clean=False
              for m in file_members:
                  if m[0]=='pine/SMI_Histogram_v0_4_FWD_UAM.pine' and m[3]:
                      body=out[m[4]:m[5]]
                      text=body.decode('utf-8', errors='replace')
                      pine_ok=all(token in text for token in [
                          '//@version=6',
                          'default_qty_type=strategy.percent_of_equity',
                          'UAM_SYSTEM_ID = "VIXALE_SMI_FWD"',
                          'ta.tsi(close, shortLen, longLen)',
                          'strategy.entry',
                          'alert(',
                      ])
                      pine_clean=(b'\x00' not in body and '\ufffd' not in text)
              score=(len(members), pos, int(pine_ok), int(pine_clean), len(out), -len(err))
              candidates.append((score,idx,p1[idx],len(out),err,members))

          candidates.sort(reverse=True)
          print('TOP CANDIDATES')
          for item in candidates[:12]:
              score,idx,ch,outlen,err,members=item
              print('candidate', {'index':idx,'char':ch,'score':score,'outlen':outlen,'error':err})
              print('members', [(m[0],m[1],m[2].decode("latin1"),m[3]) for m in members[:12]])

          best=candidates[0]
          score,idx,ch,outlen,err,members=best
          print('BEST_REMOVAL_INDEX',idx)
          print('BEST_REMOVAL_CHAR',repr(ch))
          print('BEST_SCORE',score)
          print('BEST_ERROR',err)

          joined=p0+p1[:idx]+p1[idx+1:]+p2
          compressed=base64.b64decode(joined, validate=True)
          out,_=partial_gzip(compressed)
          members,_=tar_members(out)
          for name,size,typeflag,complete,start,end in members:
              if complete and typeflag in (b'0',b'\0'):
                  body=out[start:end]
                  print('RECOVERED_MEMBER',name,size,hashlib.sha256(body).hexdigest())
                  if name=='pine/SMI_Histogram_v0_4_FWD_UAM.pine':
                      text=body.decode('utf-8')
                      print('PINE_NULS', body.count(b'\x00'), 'PINE_REPLACEMENTS', text.count('\ufffd'))
                      print('PINE_LAST_40_LINES_BEGIN')
                      print('\n'.join(text.splitlines()[-40:]))
                      print('PINE_LAST_40_LINES_END')

      - name: Inspect bridge entry target and routing primitives
        shell: python
        run: |
          from pathlib import Path

          def show_hits(path, needles, radius=45):
              lines=Path(path).read_text(encoding='utf-8').splitlines()
              print(f'=== {path} lines={len(lines)} ===')
              for needle in needles:
                  hits=[i for i,line in enumerate(lines) if needle in line]
                  print(f'--- {needle!r}: hits={len(hits)} ---')
                  for i in hits[:4]:
                      lo=max(0,i-radius); hi=min(len(lines),i+radius+1)
                      print(f'@@ {i+1} @@')
                      for j in range(lo,hi): print(f'{j+1:05d}: {lines[j][:1800]}')

          show_hits('bridge/ib_bridge.py', [
              'async def handle_ib_action',
              'async def process_signal_background',
              'def find_exact_managed_target_trade',
              'async def cancel_and_verify_edge_target',
              'async def wait_for_edge_partial_position_sync',
              'target_trade =',
              'LimitOrder(',
              'target_tif',
              'mark_managed_position(data',
          ])

      - name: Inspect Render parser payload and validation primitives
        shell: python
        run: |
          from pathlib import Path

          lines=Path('app.js').read_text(encoding='utf-8').splitlines()
          needles=[
              'function parseJsonTradingViewAlert',
              'function isOpenOnSetupRow',
              'function bridgePayload',
              'function validateBridgePayload',
              'function isRecognizedTradeWebhook',
              'function isBridgeExecutionCallback',
          ]
          for needle in needles:
              hits=[i for i,line in enumerate(lines) if needle in line]
              print(f'--- {needle!r}: hits={len(hits)} ---')
              for i in hits[:3]:
                  lo=max(0,i-55); hi=min(len(lines),i+100)
                  print(f'@@ {i+1} @@')
                  for j in range(lo,hi): print(f'{j+1:05d}: {lines[j][:1800]}')

      - name: Baseline syntax
        run: |
          node --check app.js
          python -m py_compile bridge/ib_bridge.py
