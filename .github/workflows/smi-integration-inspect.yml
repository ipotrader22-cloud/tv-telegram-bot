name: SMI Render integration inspect

on:
  push:
    branches:
      - feature/smi-v04-fwd-tws-adapter

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact app hooks and test surface
        shell: python
        run: |
          from pathlib import Path

          def show_hits(path, needles, radius=55):
              lines = Path(path).read_text(encoding='utf-8').splitlines()
              print(f'=== {path} lines={len(lines)} ===')
              for needle in needles:
                  hits = [i for i, line in enumerate(lines) if needle in line]
                  print(f'--- {needle!r} hits={len(hits)} ---')
                  for i in hits[:3]:
                      lo=max(0,i-radius); hi=min(len(lines),i+radius+1)
                      print(f'@@ line {i+1} @@')
                      for j in range(lo,hi):
                          print(f'{j+1:05d}: {lines[j][:2000]}')

          show_hits('app.js', [
              'function parseJsonTradingViewAlert',
              'function isOpenOnSetupRow',
              'function requiresBridgeExecutionConfirmation',
              'function bridgePayload',
              'function validateBridgePayload',
              'function isBridgeExecutionCallback',
              'function hasConfirmedEdgeEntryExecution',
              'function hasConfirmedCloseExecution',
              'function isRecognizedTradeWebhook',
              'async function processRecognizedTradingViewWebhookLifecycleCore',
              'async function processRecognizedTradingViewWebhook',
              'module.exports',
          ], radius=45)

          print('=== tests ===')
          for p in sorted(Path('tests').glob('*')):
              if p.is_file(): print(p.as_posix())
      - name: Baseline checks
        run: |
          node --check app.js
          python -m py_compile bridge/ib_bridge.py bridge/ib_bridge_core.py bridge/smi_forward_adapter.py
