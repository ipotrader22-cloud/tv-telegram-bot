name: SMI Render integration inspect

on:
  push:
    branches:
      - feature/smi-v04-fwd-tws-adapter

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact parser validation and callback ranges
        shell: python
        run: |
          from pathlib import Path
          lines = Path('app.js').read_text(encoding='utf-8').splitlines()
          for lo, hi, label in [
              (1428, 1615, 'JSON parser'),
              (11360, 11438, 'execution identities and Edge exit callback'),
              (11527, 11664, 'bridge validation and forwarder'),
              (11920, 12095, 'execution-first lifecycle core'),
          ]:
              print(f'=== {label}: {lo}-{hi} ===')
              for i in range(lo-1, min(hi, len(lines))):
                  print(f'{i+1:05d}: {lines[i][:2200]}')
      - name: Baseline checks
        run: |
          node --check app.js
          python -m py_compile bridge/ib_bridge.py bridge/ib_bridge_core.py bridge/smi_forward_adapter.py
