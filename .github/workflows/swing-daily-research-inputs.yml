name: Swing Daily Research Inputs
on:
  workflow_dispatch:
  schedule:
    - cron: "50 13 * * 1-5"
    - cron: "50 14 * * 1-5"
permissions:
  contents: read
concurrency:
  group: swing-daily-research-inputs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resolve New York collection window
        id: window
        env:
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          local_hour="$(TZ=America/New_York date +%H)"
          run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
            echo "Manual recovery dispatch accepted at local_hour=$local_hour"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" && "$local_hour" == "09" ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled research collection accepted at local_hour=$local_hour"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            offset="$(TZ=America/New_York date +%z)"
            case "$offset" in
              -0400) expected="50 13 * * 1-5" ;;
              -0500) expected="50 14 * * 1-5" ;;
              *) echo "::error::Unsupported ET offset"; exit 1 ;;
            esac
            if [[ "$SCHEDULED_CRON" == "$expected" ]]; then
              echo "::error::Due 09:50 ET research collection was delivered late (actual hour=$local_hour). This run produced NO OHLCV artifact. Never report RESEARCH_INPUTS PASS."
              exit 1
            fi
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "Expected DST companion schedule skipped, not a research PASS."
            exit 0
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "Off-hour DST companion schedule skipped cleanly: local_hour=$local_hour run_attempt=$run_attempt"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.collect == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.collect == 'true'
        with:
          node-version: "20"
      - name: Collect dated OHLCV and technical evidence
        if: steps.window.outputs.collect == 'true'
        run: node scripts/swing-daily-research-inputs.js
      - name: Retain full source evidence
        if: always() && steps.window.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swing-research-${{ github.run_id }}
          path: swing-research-inputs.json
          if-no-files-found: warn
          retention-days: 30
