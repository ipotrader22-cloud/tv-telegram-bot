name: Swing Daily Research Inputs
on:
  workflow_dispatch:
  schedule:
    - cron: "50 13,14 * * 1-5"
permissions:
  contents: read
concurrency:
  group: swing-daily-research-inputs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve New York collection window
        id: window
        run: |
          local_hour="$(TZ=America/New_York date +%H)"
          run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$local_hour" == "09" || "$run_attempt" -gt 1 ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
            echo "Research collection enabled: event=$GITHUB_EVENT_NAME local_hour=$local_hour run_attempt=$run_attempt"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "Research collection skipped: event=$GITHUB_EVENT_NAME local_hour=$local_hour run_attempt=$run_attempt"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.collect == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.collect == 'true'
        with:
          node-version: "20"
      - name: Collect dated OHLCV and technical evidence
        if: steps.window.outputs.collect == 'true'
        run: node scripts/swing-daily-research-inputs.js
      - name: Retain full source evidence
        if: always() && steps.window.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swing-research-${{ github.run_id }}
          path: swing-research-inputs.json
          if-no-files-found: warn
          retention-days: 30
