name: Temporary Dashboard live-position verification

on:
  push:
    branches:
      - fix/dashboard-live-position-target-stop-pnl
    paths:
      - .github/workflows/temporary-dashboard-live-position-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scope patch to public Open Positions header
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_dashboard_live_position.py')
          source = path.read_text()
          old = '''app = replace_once(
              app,
              "              <th>Entry</th>\\n              <th>Exit</th>\\n              <th>Qty</th>",
              "              <th>Entry</th>\\n              <th>Target</th>\\n              <th>Stop Ref</th>\\n              <th>Qty</th>",
              'open positions headers',
          )'''
          new = '''helper_marker = "Open P&amp;L updates live. Target and Stop Ref are system reference levels; final exit and result appear after the trade closes."
          helper_index = app.find(helper_marker)
          section_start = app.rfind('<h2>Open Positions</h2>', 0, helper_index)
          section_end = app.find('<h2>Pending / Working Orders</h2>', helper_index)
          if helper_index < 0 or section_start < 0 or section_end < 0:
              raise SystemExit('public Open Positions section markers not found')
          public_section = app[section_start:section_end]
          public_section = replace_once(
              public_section,
              "              <th>Entry</th>\\n              <th>Exit</th>\\n              <th>Qty</th>",
              "              <th>Entry</th>\\n              <th>Target</th>\\n              <th>Stop Ref</th>\\n              <th>Qty</th>",
              'public open positions headers',
          )
          app = app[:section_start] + public_section + app[section_end:]'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one header patch block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Apply targeted patch
        run: python .github/scripts/patch_dashboard_live_position.py
      - name: Normalize Live Open P&L HTML label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          source = path.read_text()
          old = '<div class="label">Live Open P&L</div>'
          if source.count(old) != 1:
              raise SystemExit(f'expected one native Live Open P&L label, found {source.count(old)}')
          path.write_text(source.replace(old, '<div class="label">Live Open P&amp;L</div>', 1))
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          node --check app.js
          node --check website_dashboard_snapshot_refinement.js
          node --check tests/test_dashboard_snapshot_refinement.js
          node --check tests/test_public_dashboard_live_pnl.js
          node --check tests/test_home_live_open_pnl.js
          node --check tests/test_public_performance.js
          node --check tests/test_dashboard_access_security.js
          node --check tests/test_home_performance_refinement.js
      - name: Focused regression suite
        run: |
          node tests/test_dashboard_snapshot_refinement.js
          node tests/test_public_dashboard_live_pnl.js
          node tests/test_home_live_open_pnl.js
          node tests/test_public_performance.js
          node tests/test_dashboard_access_security.js
          node tests/test_home_performance_refinement.js
      - name: Diff hygiene
        run: git diff --check
      - name: Review targeted diff
        run: git diff -- app.js website_dashboard_snapshot_refinement.js tests/test_dashboard_snapshot_refinement.js tests/test_public_dashboard_live_pnl.js
      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js website_dashboard_snapshot_refinement.js tests/test_dashboard_snapshot_refinement.js tests/test_public_dashboard_live_pnl.js
          git commit -m "Fix Dashboard live position metrics"
          git push origin HEAD:fix/dashboard-live-position-target-stop-pnl
