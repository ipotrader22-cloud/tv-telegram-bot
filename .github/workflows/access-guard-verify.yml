name: Access Guard Verify

on:
  push:
    branches:
      - feature/dashboard-access-guard

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check lib/dashboard-access-security.js
          node --check lib/dashboard-access-security-source-blocks.js
          node --check website_dashboard_access_security.js
          node --check tests/test_dashboard_access_security.js
      - name: Focused access security regression
        run: node tests/test_dashboard_access_security.js
