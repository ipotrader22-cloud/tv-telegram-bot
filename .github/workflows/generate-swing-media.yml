name: Generate Swing media assets

on:
  push:
    branches:
      - feature/swing-instructional-video-review-window
    paths:
      - generate_swing_media_assets.py
      - .github/workflows/generate-swing-media.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/swing-instructional-video-review-window
          fetch-depth: 0
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow reportlab
      - name: Generate video, captions, poster, and PDF source
        run: python generate_swing_media_assets.py
      - name: Verify generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          root = Path('.')
          parts = sorted((root/'assets'/'swing-trading').glob('how-to-follow-vixale-swing-trading.mp4.b64.part*'))
          assert parts, 'missing video parts'
          video = base64.b64decode(''.join(p.read_text().strip() for p in parts))
          assert len(video) > 500000 and video[4:8] == b'ftyp'
          poster = base64.b64decode((root/'assets'/'swing-trading'/'how-to-follow-vixale-swing-trading-poster.jpg.b64').read_text().strip())
          assert poster[:2] == b'\xff\xd8'
          captions = (root/'assets'/'swing-trading'/'how-to-follow-vixale-swing-trading.en.vtt').read_text()
          assert captions.startswith('WEBVTT')
          pdf = base64.b64decode((root/'Vixale_Trading_Guide.pdf.b64').read_text().strip())
          assert pdf.startswith(b'%PDF-') and len(pdf) > 5000
          print('media verification: PASS')
          PY
      - name: Commit generated assets
        run: |
          rm -rf .swing_media_work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/swing-trading Vixale_Trading_Guide.pdf.b64
          if git diff --cached --quiet; then
            echo "Generated assets already current"
          else
            git commit -m "Generate Swing instructional media and Trading Guide PDF"
            git push origin HEAD:feature/swing-instructional-video-review-window
          fi
