name: Engine 2 staging external API HTML parity (read only)
on:
  workflow_dispatch:
  push:
    branches: [engine-v2-shadow-foundation-20261016]
    paths:
      # A new model provider can change what the shadow site publishes even if
      # the page renderer itself is unchanged. Recheck external parity for
      # every staging model-source or publishing change, read-only.
      - 'engine-v2/**'
      - '.github/workflows/engine-v2-staging-external-parity.yml'
permissions:
  contents: read
concurrency:
  group: engine2-external-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  external-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression-test transient retries and permanent fail-closed gates
        run: node --test engine-v2/staging-external-parity.test.cjs
      - name: Verify read-only Resend provider status and message identity gates
        run: node --test engine-v2/resend-provider-readback.test.cjs
      - name: Inspect external read-only staging API and exact rendered HTML
        run: node engine-v2/staging-external-parity.cjs
