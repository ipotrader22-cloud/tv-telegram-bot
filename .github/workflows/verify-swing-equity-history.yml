name: Verify Swing equity history fix

on:
  push:
    branches:
      - fix/swing-equity-accounting-stale

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify Swing parsing and presentation regressions
        run: |
          node --check lib/swing-leaders-core.js
          node --check lib/swing-leaders.js
          node --check tests/test_swing_leaders.js
          node tests/test_swing_leaders.js
          node tests/test_swing_leaders_app_integration.js
          node tests/test_swing_leaders_candidate_feed_compat.js
          node tests/test_swing_canonical_route_refinement.js
          node tests/test_swing_instructional_refinement.js
          node tests/test_trading_systems_refinement.js
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          ! printf '%s\n' "$changed" | grep -Eq '^(app\.js|bridge/|pine/|scripts/deploy-ib-bridge|.*ib_bridge|.*TradingLab|.*trading_lab)'
