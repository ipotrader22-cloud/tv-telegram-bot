name: SMI baseline regression probe

on:
  push:
    branches:
      - feature/smi-v04-fwd-tws-adapter

permissions:
  contents: read

jobs:
  baseline-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify unpatched Edge app integration baseline
        run: node tests/test_vixale_edge_app_integration.js
