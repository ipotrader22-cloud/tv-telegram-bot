name: Swing Morning Publication Verification

# A lightweight, independent production-only check for the 10:00 ET model review.
# GitHub cron is UTC; 14:xx covers EDT and 15:xx covers EST.
# The NY local-hour guard prevents duplicate off-hour checks at DST transitions.
on:
  workflow_dispatch:
  schedule:
    - cron: "11,18 14 * * 1-5"
    - cron: "11,18 15 * * 1-5"

permissions:
  contents: read

# Serializes publication checks only; this is not a lock for ChatGPT writers.
concurrency:
  group: swing-morning-publication-verification
  cancel-in-progress: false

jobs:
  verify-swing-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve New York review window
        id: review
        shell: bash
        env:
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          review_date="$(TZ=America/New_York date +%F)"
          local_hour="$(TZ=America/New_York date +%H)"
          echo "review_date=$review_date" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            offset="$(TZ=America/New_York date +%z)"
            case "$offset" in
              -0400) expected="11,18 14 * * 1-5" ;;
              -0500) expected="11,18 15 * * 1-5" ;;
              *) echo "::error::Unexpected ET UTC offset"; exit 1 ;;
            esac
            if [[ "$SCHEDULED_CRON" == "$expected" ]]; then
              echo "check=true" >> "$GITHUB_OUTPUT"
              echo "Canonical publication run accepted (actual ET hour=$local_hour); verifying current-day production, not claiming PASS from schedule."
            else
              echo "check=false" >> "$GITHUB_OUTPUT"
              echo "DST companion cron skipped; no publication PASS."
            fi
          else
            echo "check=true" >> "$GITHUB_OUTPUT"
            echo "Verifying Swing publication for $review_date at local hour $local_hour ET."
          fi

      - name: Check out production main
        if: steps.review.outputs.check == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        if: steps.review.outputs.check == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check NYSE session calendar
        id: calendar
        if: steps.review.outputs.check == 'true'
        env:
          REVIEW_DATE: ${{ steps.review.outputs.review_date }}
        run: |
          node -e 'const s=require("./scripts/swing-market-calendar").session(process.env.REVIEW_DATE); require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"open="+s.open+"\n"); console.log(JSON.stringify({gate:"MARKET_SESSION",...s}));'

      - name: Verify current-day Swing HTML/API parity
        if: steps.review.outputs.check == 'true' && steps.calendar.outputs.open == 'true'
        env:
          QA_EN_ORIGIN: https://www.vixale.com
          QA_SWING_EXPECTED_DATE: ${{ steps.review.outputs.review_date }}
        run: node scripts/qa-swing-publication-retry.js

      - name: Retain exact publication gate evidence
        if: always() && steps.review.outputs.check == 'true' && steps.calendar.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swing-publication-${{ steps.review.outputs.review_date }}-${{ github.run_id }}
          path: swing-publication-evidence.json
          if-no-files-found: error
          retention-days: 30


