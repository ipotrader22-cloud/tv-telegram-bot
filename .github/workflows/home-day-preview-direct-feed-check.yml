name: Homepage Day Preview Direct Feed Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax
        run: |
          node --check website_home_day_preview_feed_refinement.js
          node --check tests/test_home_day_preview_direct_feed.js
          node --check website_conversion_home_refinement.js
          node --check website_conversion_final_qa_refinement.js
      - name: Direct-feed regression
        run: node tests/test_home_day_preview_direct_feed.js
      - name: Existing homepage chart regressions
        run: |
          node tests/test_issue123_pr2_homepage_preview.js
          node tests/test_issue123_pr7_final_qa.js
          node tests/test_home_preview_chart_readability_fix.js
          node tests/test_home_performance_refinement.js
          node tests/test_home_runtime_script_injection.js
          node tests/test_chart_inline_script_injection.js
      - name: Diff check
        run: git diff --check origin/main...HEAD
