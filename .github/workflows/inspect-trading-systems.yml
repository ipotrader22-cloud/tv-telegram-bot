name: Inspect current Trading Systems render

on:
  push:
    branches:
      - feature/website-swing-trading
    paths:
      - .github/workflows/inspect-trading-systems.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/website-swing-trading
          fetch-depth: 0
      - name: Extract landing Russian translation function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          marker='function renderLandingHtmlRu'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('renderLandingHtmlRu not found')
          end=s.find('\nfunction ', start+len(marker))
          if end < 0: end=min(len(s),start+60000)
          block=s[start:end]
          Path('.github/inspection/landing-ru-function.txt').write_text(block,encoding='utf-8')
          print('bytes',len(block.encode()))
          PY
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/inspection/landing-ru-function.txt
          git commit -m "Inspect landing Russian translation"
          git push origin HEAD:feature/website-swing-trading
