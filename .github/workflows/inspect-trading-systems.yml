name: Inspect current Trading Systems render

on:
  push:
    branches:
      - feature/website-swing-trading
    paths:
      - .github/workflows/inspect-trading-systems.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/website-swing-trading
          fetch-depth: 0
      - name: Extract language and route contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.js').read_text(encoding='utf-8')
          needles = [
            'renderTradingSystemsHtml',
            "'/trading-systems'",
            'Trading Systems',
            'Торговые системы',
            'renderLandingHtmlRu',
            'translate',
            "lang === 'ru'",
            "lang === \"ru\"",
            "req.query.lang",
          ]
          out=[]
          seen=[]
          for needle in needles:
            pos=0; n=0
            while n<12:
              idx=s.find(needle,pos)
              if idx<0: break
              if all(abs(idx-x)>1800 for x in seen):
                seen.append(idx)
                out.append(f'\n=== {needle} @ {idx} ===\n{s[max(0,idx-1700):min(len(s),idx+2800)]}\n')
              pos=idx+len(needle); n+=1
          text=''.join(out)
          Path('.github/inspection/trading-systems-language.txt').write_text(text,encoding='utf-8')
          print('bytes',len(text.encode()),'contexts',len(seen))
          PY
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/inspection/trading-systems-language.txt
          git commit -m "Inspect Trading Systems language routing"
          git push origin HEAD:feature/website-swing-trading
