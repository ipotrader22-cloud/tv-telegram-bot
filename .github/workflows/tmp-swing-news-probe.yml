name: Temporary Swing News Source Diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-swing-news-probe.yml'
      - 'tests/tmp_swing_news_probe.cjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/tmp_swing_news_probe.cjs
