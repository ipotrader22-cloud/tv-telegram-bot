name: SMI hardening final check

on:
  push:
    branches:
      - fix/smi-pre-tuesday-hardening

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile bridge/smi_forward_adapter.py bridge/smi_runtime_safety.py tests/test_smi_runtime_safety.py tests/test_smi_forward_concurrency.py tests/test_smi_forward_bridge_isolation.py
      - name: SMI runtime and shared ownership
        run: python tests/test_smi_runtime_safety.py
      - name: SMI concurrency isolation
        run: python tests/test_smi_forward_concurrency.py
      - name: SMI bridge isolation
        run: python tests/test_smi_forward_bridge_isolation.py
      - name: Render integration regression
        run: node tests/test_smi_forward_render_integration.js
