name: Apply Swing Leaders Integration

on:
  push:
    branches:
      - feature/swing-leaders-v1
    paths:
      - .github/workflows/apply-swing-leaders-integration.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/swing-leaders-v1
          fetch-depth: 0

      - name: Apply targeted integration patch
        run: node scripts/apply-swing-leaders-integration.js

      - name: Syntax check app
        run: node --check app.js

      - name: Test Swing Leaders feed
        run: node tests/test_swing_leaders.js

      - name: Test Swing Leaders app wiring
        run: node tests/test_swing_leaders_app_integration.js

      - name: Preserve Trading Systems hierarchy
        run: node tests/test_trading_systems_hierarchy.js

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified integration
        run: |
          rm scripts/apply-swing-leaders-integration.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js docs/VECO_DEVELOPER_HANDBOOK.md scripts/apply-swing-leaders-integration.js
          git commit -m "Integrate Swing Leaders public feed"
          git push origin HEAD:feature/swing-leaders-v1
