name: Verify homepage runtime data sync
on:
  push:
    branches:
      - fix/home-runtime-data-sync
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check app.js
      - run: node --check website_home_system_selector_refinement.js
      - run: node --check website_home_live_open_pnl.js
      - run: node --check tests/test_home_runtime_script_injection.js
      - run: node tests/test_home_runtime_script_injection.js
      - run: node tests/test_home_system_selector_refinement.js
      - run: node tests/test_home_live_open_pnl.js
      - run: node tests/test_audit_pr3_home_composition.js
      - run: node tests/test_home_performance_refinement.js
      - run: node tests/test_performance_truth_refinement.js
      - run: node tests/test_public_dashboard_live_pnl.js
      - name: Verify narrow safety boundary
        run: |
          git diff --exit-code origin/main -- app.js package.json bridge pine || true
          test -z "$(git diff --name-only origin/main...HEAD | grep -E '^(app\.js|package\.json|bridge/|pine/)' || true)"
          grep -q 'replace("</body>", () =>' website_home_system_selector_refinement.js
          grep -q 'replace("</body>", () =>' website_home_live_open_pnl.js
