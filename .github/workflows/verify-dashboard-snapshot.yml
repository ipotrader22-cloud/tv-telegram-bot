name: Verify dashboard snapshot refinement

on:
  push:
    branches:
      - docs/current-state-pr90
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check website_dashboard_snapshot_refinement.js
          node --check website_home_system_selector_refinement.js
          node --check website_home_live_open_pnl.js
          node --check website_home_performance_refinement.js
      - name: Focused regressions
        run: |
          node tests/test_dashboard_snapshot_refinement.js
          node tests/test_home_system_selector_refinement.js
          node tests/test_home_live_open_pnl.js
          node tests/test_home_performance_refinement.js
          node tests/test_public_dashboard_live_pnl.js
          node tests/test_public_performance.js
      - name: Package preload contract
        run: node -e "const p=require('./package.json'); if(!p.scripts.start.startsWith('node -r ./website_dashboard_snapshot_refinement.js ')) process.exit(1);"
