name: Verify audit performance PR2
on:
  push:
    branches:
      - fix/audit-performance-semantics-pr2
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check app.js
      - run: node --check website_public_performance.js
      - run: node --check website_performance_truth_refinement.js
      - run: node --check tests/test_public_performance.js
      - run: node --check tests/test_performance_truth_refinement.js
      - run: node tests/test_public_performance.js
      - run: node tests/test_performance_truth_refinement.js
      - run: node tests/test_home_performance_refinement.js
      - run: node tests/test_home_live_open_pnl.js
      - run: node tests/test_home_system_selector_refinement.js
      - name: Verify preload and scope
        run: |
          node -e "const p=require('./package.json'); const s=p.scripts.start; if(!s.startsWith('node -r ./website_performance_truth_refinement.js ')) throw new Error('performance truth refinement must be first preload');"
          if grep -n "working_count" website_public_performance.js; then exit 1; fi
          grep -q "pending_count" website_public_performance.js
          grep -q "Pending Setups" website_performance_truth_refinement.js
