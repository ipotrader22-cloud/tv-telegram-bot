name: Production EN/RU Browser QA

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "website_services_source_parity_fix.js"
      - "website_russian_localization.js"
      - "website_russian_translations_regression.js"
      - "tests/test_services_ru_parity_fix.js"
      - "tests/test_services_ru_form_controls.js"
      - "scripts/qa-production-locales.js"
      - "scripts/qa-production-services-form-controls.js"
      - ".github/workflows/production-locale-browser-qa.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "package.json"
      - "website_*.js"
      - "lib/**"
      - "public/**"
      - "scripts/qa-production-locales.js"
      - "scripts/qa-production-services-form-controls.js"
      - ".github/workflows/production-locale-browser-qa.yml"

permissions:
  contents: read

concurrency:
  group: production-locale-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locale-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax checks
        run: |
          node --check website_services_source_parity_fix.js
          node --check website_russian_localization.js
          node --check website_russian_translations_regression.js
          node --check scripts/qa-production-locales.js
          node --check scripts/qa-production-services-form-controls.js
          node --check tests/test_services_ru_parity_fix.js
          node --check tests/test_services_ru_form_controls.js

      - name: Services RU parity regression
        run: |
          node tests/test_services_ru_parity_fix.js
          node tests/test_services_ru_form_controls.js

      - name: Existing Russian localization regressions
        run: |
          node tests/test_russian_localization.js
          node tests/test_russian_current_public_pages.js

  browser-qa:
    if: github.event_name != 'pull_request'
    needs: locale-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright for QA only
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Allow production auto-deploy to settle
        if: github.event_name == 'push'
        run: sleep 120

      - name: Run EN/RU production browser QA
        env:
          QA_EN_ORIGIN: https://www.vixale.com
          QA_RU_ORIGIN: https://ru.vixale.com
          QA_OUTPUT_DIR: artifacts/production-locale-qa
        run: node scripts/qa-production-locales.js

      - name: Run RU Services form-control QA
        env:
          QA_RU_ORIGIN: https://ru.vixale.com
        run: node scripts/qa-production-services-form-controls.js

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-locale-browser-qa-${{ github.run_id }}
          path: artifacts/production-locale-qa
          if-no-files-found: warn
          retention-days: 14
