name: Production EN/RU Browser QA

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/qa-production-locales.js"
      - ".github/workflows/production-locale-browser-qa.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "package.json"
      - "website_*.js"
      - "lib/**"
      - "public/**"
      - "scripts/qa-production-locales.js"
      - ".github/workflows/production-locale-browser-qa.yml"

permissions:
  contents: read

concurrency:
  group: production-locale-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright for QA only
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Allow production auto-deploy to settle
        if: github.event_name == 'push'
        run: sleep 120

      - name: Run EN/RU production browser QA
        env:
          QA_EN_ORIGIN: https://www.vixale.com
          QA_RU_ORIGIN: https://ru.vixale.com
          QA_OUTPUT_DIR: artifacts/production-locale-qa
        run: node scripts/qa-production-locales.js

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-locale-browser-qa-${{ github.run_id }}
          path: artifacts/production-locale-qa
          if-no-files-found: warn
          retention-days: 14
