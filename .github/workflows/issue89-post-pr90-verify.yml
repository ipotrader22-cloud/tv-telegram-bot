name: Issue 89 post-PR90 verification

on:
  push:
    branches:
      - verify/issue89-on-main-after-pr90

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main locally
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
      - name: Install dependencies
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check app.js
          node --check website_about_copy_polish.js
          node --check website_about_refinement.js
          node --check tests/test_issue89_about_preload_consolidation.js
      - name: Focused regressions
        run: |
          node tests/test_issue89_about_preload_consolidation.js
          node tests/test_about_copy_polish.js
          node tests/test_about_refinement.js
          node tests/test_navigation_disclosure_refinement.js
          node tests/test_audit_pr3_home_composition.js
          node tests/test_public_polish_refinement.js
          node tests/test_website_funnel_measurement.js
      - name: Verify intended diff only
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/changed.txt
          if grep -Eq '^(bridge/|pine/|app.js$)' /tmp/changed.txt; then
            echo "Unexpected execution/core file in Issue 89 diff" >&2
            exit 1
          fi
