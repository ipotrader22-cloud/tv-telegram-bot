name: Issue 88 implementation verification

on:
  push:
    branches:
      - feature/issue88-funnel-measurement

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow integration patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('website_dashboard_access_security.js')
          s = p.read_text()
          require_old = 'const { ACCESS_HELPERS, NEW_PASSWORD_AND_VERIFY_ROUTES, DELETE_ROUTE } = require("./lib/dashboard-access-security-source-blocks");'
          require_new = require_old + '\nconst websiteFunnelSourcePatch = require("./lib/website-funnel-source-patch");'
          if 'websiteFunnelSourcePatch' not in s:
              if require_old not in s: raise SystemExit('dashboard patch require anchor missing')
              s = s.replace(require_old, require_new, 1)
          old = '  if (source.includes(APP_PATCH_MARKER)) return source;'
          new = '  if (source.includes(APP_PATCH_MARKER)) return websiteFunnelSourcePatch.patchAppSource(source);'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('dashboard patch idempotency anchor missing')
          old_return = '  return out;\n}\n\nfunction installAppSourcePatch() {'
          new_return = '  out = websiteFunnelSourcePatch.patchAppSource(out);\n  return out;\n}\n\nfunction installAppSourcePatch() {'
          if new_return not in s:
              if old_return not in s: raise SystemExit('dashboard patch return anchor missing')
              s = s.replace(old_return, new_return, 1)
          p.write_text(s)

          p = Path('website_navigation_disclosure_refinement.js')
          s = p.read_text()
          require_line = 'const Module = require("module");'
          require_new = require_line + '\nconst { injectFunnelAccessScript } = require("./lib/website-funnel-client");'
          if 'injectFunnelAccessScript' not in s:
              if require_line not in s: raise SystemExit('navigation require anchor missing')
              s = s.replace(require_line, require_new, 1)
          old = '  if (PUBLIC_NAV_PATHS.has(path)) result = injectStyles(result);\n  return result;'
          new = '  if (PUBLIC_NAV_PATHS.has(path)) {\n    result = injectStyles(result);\n    result = injectFunnelAccessScript(result);\n  }\n  return result;'
          if new not in s:
              if old not in s: raise SystemExit('navigation funnel injection anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          if ! git diff --quiet -- website_dashboard_access_security.js website_navigation_disclosure_refinement.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website_dashboard_access_security.js website_navigation_disclosure_refinement.js
            git commit -m "feat: integrate website funnel measurement"
            git push origin HEAD:feature/issue88-funnel-measurement
          fi
      - name: Syntax checks
        run: |
          node --check app.js
          node --check lib/website-funnel-metrics.js
          node --check lib/website-funnel-source-patch.js
          node --check lib/website-funnel-client.js
          node --check website_dashboard_access_security.js
          node --check website_navigation_disclosure_refinement.js
          node --check tests/test_website_funnel_measurement.js
      - name: Focused regressions
        run: |
          node tests/test_website_funnel_measurement.js
          node tests/test_dashboard_access_security.js
          node tests/test_navigation_disclosure_refinement.js
          node tests/test_public_ia_refinement.js
      - name: Safety boundary
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(bridge/|pine/)'; then
            echo 'Trading/execution file changed unexpectedly' >&2
            exit 1
          fi
